name: Смена аватарки канала

on:
  schedule:
    - cron: "0 9 * * 1"  # каждый понедельник в 9:00 UTC
  workflow_dispatch:  # кнопка "Run workflow" на вкладке Actions — заменяет живую Telegram-кнопку "Сменить аватар"

jobs:
  change-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Сменить аватарку
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          HUGGINGFACE_MODEL: ${{ vars.HUGGINGFACE_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRAND_PRIMARY_COLOR: ${{ vars.BRAND_PRIMARY_COLOR }}
          BRAND_BACKGROUND_COLOR: ${{ vars.BRAND_BACKGROUND_COLOR }}
          BRAND_TEXT_COLOR: ${{ vars.BRAND_TEXT_COLOR }}
          BRAND_IMAGE_STYLE: ${{ vars.BRAND_IMAGE_STYLE }}
        run: python avatar_manager.py


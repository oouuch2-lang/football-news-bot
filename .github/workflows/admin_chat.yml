name: Переписка с владельцем канала

on:
  schedule:
    - cron: "*/5 * * * *"  # каждые 5 минут — репозиторий публичный, лимита минут нет
  workflow_dispatch:  # ручной запуск из вкладки Actions на GitHub

permissions:
  contents: write  # нужно, чтобы бот мог закоммитить настройки и состояние переписки

jobs:
  admin-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить сообщения и применить решения
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          HUGGINGFACE_MODEL: ${{ vars.HUGGINGFACE_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python admin_agent.py

      - name: Сохранить настройки и состояние переписки
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/admin_state.json data/settings.json
          if git diff --cached --quiet; then
            echo "Изменений нет, коммитить нечего"
          else
            git commit -m "Обновить состояние переписки с ботом"
            git pull --rebase origin master
            git push
          fi
